name: CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles/**'
      - 'js/**'
      - 'i18n.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icons/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles/**'
      - 'js/**'
      - 'i18n.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icons/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'

# Cancel a stale PR run when new commits land on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-static:
    name: Validate static shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The CACHE_REV bump-reminder step diffs base..head; checkout's default
          # fetch-depth=1 gives us the merge commit but not the PR head, which
          # makes `git diff base head` error with "bad object". Full history is
          # cheap on a repo this size.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate HTML parses
        run: python3 scripts/validate_html.py index.html

      - name: Validate manifest.json
        run: python3 scripts/validate_manifest.py manifest.json

      - name: Validate sw.js precache & CACHE_REV
        run: python3 scripts/validate_sw.py sw.js

      - name: Validate i18n dictionary parity
        run: python3 scripts/validate_i18n.py i18n.js .

      - name: Warn if precached assets changed without a CACHE_REV bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_cache_rev.py "$BASE_SHA" "$HEAD_SHA"
